[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Adamo"

[tool.flwr.app.components]
serverapp = "lib.flower.server:app"
clientapp = "lib.flower.client:app"

[tool.flwr.app.config]
fraction-fit = 1
fraction-evaluate = 0
min-evaluate-clients = 0
min-available-clients = 1
min-fit-clients = 0

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2
options.backend.client-resources.num-cpus = 10
options.backend.client-resources.num-gpus = 1
options.backend.redirect_client_output = false